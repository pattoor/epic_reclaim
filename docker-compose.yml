services:
  epic-reclaim:
    build: .
    image: epic-reclaim:1.0.0
    container_name: epic-reclaim
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8765}:8765"
      # Standalone noVNC screen: only active while an authentication session
      # is running (processes start/stop at runtime inside the container).
      - "${NOVNC_PORT:-6080}:6080"
    volumes:
      - database:/app/data/database
      - sessions:/app/data/sessions
      - state:/app/data/state
    environment:
      - DATABASE_PATH=/app/data/database/epic.db
      - SESSIONS_PATH=/app/data/sessions
      - STATE_PATH=/app/data/state
      - NOVNC_PORT=6080

volumes:
  database:
  sessions:
  state:
